# ============================================
# render.yaml — Blueprint de despliegue en Render
# ============================================
# Este archivo permite desplegar todo el sistema
# con un solo clic desde el Dashboard de Render.
# https://render.com/docs/blueprint-spec

databases:
  - name: systma-db
    plan: free
    databaseName: db_gestion_systma
    user: systma_user
    region: oregon

services:
  # ── Backend Django ──────────────────────────
  - type: web
    name: systma-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --log-file -"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: systma-db
          property: connectionString
      - key: DB_SSL
        value: "True"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: USE_CLOUDINARY
        sync: false  # Configurar manualmente en el dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Se configura después de crear el frontend
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # ── Frontend React (Vite) ──────────────────
  - type: web
    name: systma-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Se configura después de crear el backend
